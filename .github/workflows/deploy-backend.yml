# CI/CD Pipeline: Auto-deploy backend to Google App Runner
# Triggers on every push to main that modifies backend/ files
# Uses Workload Identity Federation (no JSON keys needed!) -- same
# service account and provider as deploy-frontend.yml.
#
# Deliberately does NOT pass --memory/--cpu/--max-instances/--set-env-vars:
# `gApp Runner deploy` with just a new --image reuses the existing service's
# resource limits, scaling, and environment variables, so this can't
# accidentally downgrade or wipe the live config (checked before adding
# this workflow: 1 CPU / 512Mi / max-scale 20, and the real secrets/env
# vars already set directly on the service).

name: Deploy Backend to App Runner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

env:
  PROJECT_ID: project-55a59106-18bc-453c-872
  REGION: us-central1
  SERVICE_NAME: munim-backend
  IMAGE_NAME: munim-backend
  WIF_PROVIDER: projects/1051889700424/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-deployer@project-55a59106-18bc-453c-872.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to AWS
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to App Runner
        run: |
          gApp Runner deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
